<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 패널</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f0f0; max-width: 500px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        label { font-size: 0.8rem; font-weight: bold; color: #888; display: block; margin-top: 10px; }
        input, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #d4a373; color: white; border: none; cursor: pointer; font-weight: bold; }
        .red { background: #dc2743; }
        .black { background: #333; margin-top: 10px; }
        .status { font-size: 0.8rem; color: #2ecc71; text-align: right; margin-bottom: 10px; }
        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>🤫 실전 관리 본부</h1>
    <div class="status" id="db-status">서버 연결 중...</div>

    <div class="card">
        <strong>1. 실시간 문구/가격/버튼 수정</strong>
        <label>상단 배지</label><input type="text" id="badge">
        <label>메인 제목</label><input type="text" id="title">
        <label>상세 설명</label><input type="text" id="sub">
        <hr>
        <label>1일 가격</label><input type="text" id="p1">
        <label>7일 가격</label><input type="text" id="p2">
        <label>30일 가격</label><input type="text" id="p3">
        <hr>
        <label>하단 버튼 멘트</label><input type="text" id="btnText">
        <label>하단 버튼 링크</label><input type="text" id="btnLink">
        <button onclick="saveText()">서버로 즉시 반영</button>
    </div>

    <div class="card">
        <strong>2. 광고 관리 (등록 및 삭제)</strong>
        <label>칸 번호 (1~150)</label><input type="number" id="num">
        <label>이미지 주소 (URL)</label><input type="text" id="url">
        <label>분양 기간 (일 단위)</label><input type="number" id="days">
        <button onclick="addAd()" class="red">광고 즉시 분양</button>
        
        <!-- 삭제 버튼 추가 -->
        <button onclick="removeAd()" class="black">해당 번호 광고 강제 내리기</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA8smXxxCJWa1OrrBxnJG2oN4R2T5NKStY",
            authDomain: "dotzari.firebaseapp.com",
            databaseURL: "https://dotzari-default-rtdb.firebaseio.com",
            projectId: "dotzari",
            storageBucket: "dotzari.firebasestorage.app",
            messagingSenderId: "999257002195",
            appId: "1:999257002195:web:184f3716dd05a862600426"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('text').once('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('badge').value = data.badge || "";
                document.getElementById('title').value = data.title || "";
                document.getElementById('sub').value = data.sub || "";
                document.getElementById('p1').value = data.p1 || "";
                document.getElementById('p2').value = data.p2 || "";
                document.getElementById('p3').value = data.p3 || "";
                document.getElementById('btnText').value = data.btnText || "";
                document.getElementById('btnLink').value = data.btnLink || "";
                document.getElementById('db-status').innerText = "● 서버 데이터 로드 완료";
            }
        });

        function saveText() {
            db.ref('text').set({
                badge: document.getElementById('badge').value,
                title: document.getElementById('title').value,
                sub: document.getElementById('sub').value,
                p1: document.getElementById('p1').value,
                p2: document.getElementById('p2').value,
                p3: document.getElementById('p3').value,
                btnText: document.getElementById('btnText').value,
                btnLink: document.getElementById('btnLink').value
            }).then(() => alert("설정이 변경되었습니다!"));
        }

        function addAd() {
            const n = document.getElementById('num').value;
            const d = document.getElementById('days').value;
            if(!n || !d) { alert("번호와 기간을 입력하세요!"); return; }
            db.ref('ads/' + n).set({
                url: document.getElementById('url').value,
                expiry: Date.now() + (d * 24 * 3600000)
            }).then(() => alert(n + "번 광고 등록 완료!"));
        }

        // [삭제 기능 추가] 해당 번호의 광고 데이터를 서버에서 지웁니다.
        function removeAd() {
            const n = document.getElementById('num').value;
            if(!n) { alert("내릴 광고의 번호를 입력하세요!"); return; }
            
            if(confirm(n + "번 광고를 즉시 내리시겠습니까?")) {
                db.ref('ads/' + n).remove()
                .then(() => alert(n + "번 광고가 삭제되었습니다."));
            }
        }
    </script>
</body>
</html>
