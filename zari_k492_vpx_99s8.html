<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돗자리 (DOT-ZARI)</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; text-align: center; background-color: #fdfaf4; margin: 0; padding: 15px; }
        .header-box { background: #ffffff; padding: 30px 20px; border-radius: 30px; margin-bottom: 20px; border: 1.5px solid #f0ede5; box-shadow: 0 10px 25px rgba(212,163,115,0.08); position: relative; }
        .event-badge { display: inline-block; background: #dc2743; color: #fff; padding: 4px 12px; border-radius: 8px; font-weight: 800; font-size: 0.9rem; margin-bottom: 10px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.6; } }
        h1 { font-size: 2.2rem; margin: 0; color: #d4a373; font-weight: 900; }
        .sub-title { font-size: 1.1rem; color: #5a564e; margin: 10px 0; font-weight: 800; }
        .price-btn { background: #d4a373; color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #price-display { display: none; margin-top: 15px; padding: 15px; background: #fff9f0; border-radius: 15px; border: 1px dashed #d4a373; }
        #grid-container { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; background-color: #e9e5d9; border: 4px solid #fff; border-radius: 15px; width: 100%; max-width: 500px; margin: 0 auto; padding: 3px; }
        .cell { background-color: #fff; aspect-ratio: 1 / 1; border-radius: 2px; cursor: pointer; transition: 0.2s; position: relative; }
        .cell.selected { background-color: #FFEB3B !important; border: 1.5px solid #FBC02D; }
        .cell.occupied { background-size: cover; background-position: center; }
        .selection-info { margin-top: 25px; font-size: 1.1rem; font-weight: 800; color: #d4a373; min-height: 1.5rem; }
        .dm-btn { display: block; width: 90%; max-width: 400px; margin: 10px auto 30px auto; padding: 20px; font-size: 1.3rem; font-weight: 900; background: linear-gradient(45deg, #f09433, #dc2743, #cc2366); color: white; border-radius: 30px; text-decoration: none; box-shadow: 0 10px 20px rgba(220,39,67,0.2); transition: 0.3s; }
        .dm-btn:active { transform: scale(0.95); }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; color: white; }
        #modal-img { max-width: 90%; max-height: 70%; border-radius: 15px; margin-bottom: 20px; }
        .timer-box { font-size: 1.5rem; font-weight: 900; color: #FFEB3B; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="header-box">
        <div id="view-badge" class="event-badge">로드 중...</div>
        <h1 id="view-title">돗자리</h1>
        <div id="view-sub" class="sub-title">데이터를 가져오고 있습니다.</div>
        <button class="price-btn" onclick="togglePrice()">💰 분양 가격표 보기</button>
        <div id="price-display">
            <p>📍 1일: <span id="p1">...</span></p>
            <p>📍 7일: <span id="p2">...</span></p>
            <p>📍 30일: <span id="p3">...</span></p>
        </div>
    </div>
    <div id="grid-container"></div>
    <div id="selection-text" class="selection-info">원하는 자리를 클릭해보세요!</div>
    
    <!-- 하단 버튼: 서버에서 텍스트와 링크를 불러옵니다[span_2](start_span)[span_2](end_span) -->
    <a href="#" id="event-link" target="_blank" class="dm-btn">이벤트 참여하기</a>

    <div id="modal" onclick="closeModal()">
        <img id="modal-img" src=""><div id="timer" class="timer-box"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA8smXxxCJWa1OrrBxnJG2oN4R2T5NKStY",
            authDomain: "dotzari.firebaseapp.com",
            databaseURL: "https://dotzari-default-rtdb.firebaseio.com",
            projectId: "dotzari",
            storageBucket: "dotzari.firebasestorage.app",
            messagingSenderId: "999257002195",
            appId: "1:999257002195:web:184f3716dd05a862600426"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let timerInterval;

        function togglePrice() {
            const d = document.getElementById('price-display');
            d.style.display = d.style.display === 'block' ? 'none' : 'block';
        }
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            clearInterval(timerInterval);
        }

        db.ref('/').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            const textData = data.text || { badge:"OPEN", title:"돗자리", sub:"환영합니다", p1:"5천", p2:"3만", p3:"10만", btnText:"이벤트 참여하기", btnLink:"#" };
            const adData = data.ads || {};

            document.getElementById('view-badge').innerText = textData.badge;
            document.getElementById('view-title').innerText = textData.title;
            document.getElementById('view-sub').innerText = textData.sub;
            document.getElementById('p1').innerText = textData.p1;
            document.getElementById('p2').innerText = textData.p2;
            document.getElementById('p3').innerText = textData.p3;
            
            // 버튼 텍스트와 링크 업데이트[span_3](start_span)[span_3](end_span)
            const eventBtn = document.getElementById('event-link');
            eventBtn.innerText = textData.btnText || "이벤트 참여하기";
            eventBtn.href = textData.btnLink || "#";

            const grid = document.getElementById('grid-container');
            grid.innerHTML = '';
            for (let i = 1; i <= 150; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                const ad = adData[i];
                const isOccupied = ad && ad.expiry > Date.now();
                if (isOccupied) {
                    cell.style.backgroundImage = `url('${ad.url}')`;
                    cell.classList.add('occupied');
                }
                cell.onclick = (e) => {
                    if (isOccupied) {
                        e.stopPropagation();
                        document.getElementById('modal-img').src = ad.url;
                        document.getElementById('modal').style.display = 'flex';
                        clearInterval(timerInterval);
                        timerInterval = setInterval(() => {
                            const rem = ad.expiry - Date.now();
                            if (rem <= 0) { document.getElementById('timer').innerText = "분양 종료"; return; }
                            const days = Math.floor(rem / (1000 * 60 * 60 * 24));
                            const hrs = Math.floor((rem % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                            const mins = Math.floor((rem % (1000 * 60 * 60)) / (1000 * 60));
                            const secs = Math.floor((rem % (1000 * 60)) / 1000);
                            document.getElementById('timer').innerText = `남은 시간: ${days}일 ${hrs}시간 ${mins}분 ${secs}초`;
                        }, 1000);
                    } else {
                        document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
                        cell.classList.add('selected');
                        document.getElementById('selection-text').innerText = `선택하신 자리는 ${i}번입니다!`;
                    }
                };
                grid.appendChild(cell);
            }
        });
    </script>
</body>
</html>
