<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 패널</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f0f0; max-width: 500px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #d4a373; color: white; font-weight: bold; border: none; cursor: pointer; }
        .red-btn { background: #dc2743; }
        label { font-size: 0.8rem; font-weight: bold; color: #666; margin-top: 10px; display: block; }
    </style>
</head>
<body>
    <h1>🤫 실전 관리자 페이지</h1>
    <div class="card">
        <strong>1. 멘트 및 가격표 수정</strong>
        <label>상단 배지</label><input type="text" id="edit-badge">
        <label>메인 제목</label><input type="text" id="edit-title">
        <label>상세 설명</label><input type="text" id="edit-sub">
        <hr>
        <label>24시간 가격</label><input type="text" id="edit-p1" placeholder="5,000원">
        <label>1주일 가격</label><input type="text" id="edit-p2" placeholder="30,000원">
        <label>1개월 가격</label><input type="text" id="edit-p3" placeholder="100,000원">
        <button onclick="saveText()">가격 및 문구 저장</button>
    </div>
    <div class="card">
        <strong>2. 광고 등록</strong>
        <input type="number" id="cell-num" placeholder="칸 번호">
        <input type="text" id="img-url" placeholder="이미지 주소">
        <input type="number" id="ad-hours" placeholder="노출 시간(h)">
        <button onclick="addAd()" class="red-btn">광고 등록</button>
    </div>

    <script>
        const TEXT_KEY = 'dotzari_text_v1';
        const STORAGE_KEY = 'dotzari_data_v1';
        const old = JSON.parse(localStorage.getItem(TEXT_KEY)) || {};
        document.getElementById('edit-badge').value = old.badge || "";
        document.getElementById('edit-title').value = old.title || "";
        document.getElementById('edit-sub').value = old.sub || "";
        document.getElementById('edit-p1').value = old.p1 || "5,000원";
        document.getElementById('edit-p2').value = old.p2 || "30,000원";
        document.getElementById('edit-p3').value = old.p3 || "100,000원";

        function saveText() {
            localStorage.setItem(TEXT_KEY, JSON.stringify({
                badge: document.getElementById('edit-badge').value,
                title: document.getElementById('edit-title').value,
                sub: document.getElementById('edit-sub').value,
                p1: document.getElementById('edit-p1').value,
                p2: document.getElementById('edit-p2').value,
                p3: document.getElementById('edit-p3').value
            }));
            alert("저장 완료!");
        }

        function addAd() {
            let adData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
            const n = document.getElementById('cell-num').value;
            const u = document.getElementById('img-url').value;
            const h = document.getElementById('ad-hours').value;
            adData[n] = { url: u, expiry: Date.now() + (h * 3600000) };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(adData));
            alert("광고 등록 완료!");
        }
    </script>
</body>
</html>
