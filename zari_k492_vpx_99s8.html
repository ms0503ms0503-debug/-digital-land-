<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 패널</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f0f0; max-width: 500px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .stats-box { background: #333; color: #FFEB3B; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        input, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #d4a373; color: white; border: none; cursor: pointer; font-weight: bold; }
        .red { background: #dc2743; }
        label { font-size: 0.75rem; color: #888; font-weight: bold; }
    </style>
</head>
<body>
    <script>
        // 🔒 보안 설정: 사장님만의 비밀번호로 수정하세요!
        const adminPassword = "중대003!"; 
        const userInput = prompt("관리자 비밀번호를 입력하세요:");
        if (userInput !== adminPassword) {
            alert("비밀번호가 틀렸습니다.");
            window.location.href = "index.html";
        }
    </script>

    <h1>🤫 실전 관리 본부</h1>
    <div class="stats-box">
        <div style="font-size: 0.8rem; opacity: 0.8;">오늘 총 방문자 수</div>
        <div id="total-visits" style="font-size: 2rem; font-weight: bold;">0</div>
    </div>

    <div class="card">
        <strong>1. 공통 설정 수정</strong>
        <input type="text" id="badge" placeholder="배지"><input type="text" id="title" placeholder="제목">
        <input type="text" id="sub" placeholder="설명">
        <label>가격표 (1/7/30일)</label>
        <input type="text" id="p1"><input type="text" id="p2"><input type="text" id="p3">
        <label>문의 버튼 (문구/링크)</label>
        <input type="text" id="btnText"><input type="text" id="btnLink">
        <button onclick="saveText()">공통 설정 저장</button>
    </div>

    <div class="card">
        <strong>2. 광고 등록 및 삭제</strong>
        <input type="number" id="num" placeholder="칸 번호">
        <input type="text" id="url" placeholder="이미지 URL">
        <input type="text" id="link" placeholder="이동 링크 (http://...)">
        <input type="number" id="days" placeholder="기간 (일 단위)">
        <button onclick="addAd()" class="red">광고 즉시 분양</button>
        <button onclick="removeAd()" style="background:#333; margin-top:10px;">광고 강제 삭제</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA8smXxxCJWa1OrrBxnJG2oN4R2T5NKStY",
            authDomain: "dotzari.firebaseapp.com",
            databaseURL: "https://dotzari-default-rtdb.firebaseio.com",
            projectId: "dotzari",
            storageBucket: "dotzari.firebasestorage.app",
            messagingSenderId: "999257002195",
            appId: "1:999257002195:web:184f3716dd05a862600426"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const today = new Date().toISOString().slice(0, 10);

        db.ref('stats/visits/' + today).on('value', s => { document.getElementById('total-visits').innerText = s.val() || 0; });
        db.ref('text').once('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('badge').value = data.badge || "";
                document.getElementById('title').value = data.title || "";
                document.getElementById('sub').value = data.sub || "";
                document.getElementById('p1').value = data.p1 || "";
                document.getElementById('p2').value = data.p2 || "";
                document.getElementById('p3').value = data.p3 || "";
                document.getElementById('btnText').value = data.btnText || "";
                document.getElementById('btnLink').value = data.btnLink || "";
            }
        });

        function saveText() {
            db.ref('text').set({
                badge: document.getElementById('badge').value, title: document.getElementById('title').value,
                sub: document.getElementById('sub').value, p1: document.getElementById('p1').value,
                p2: document.getElementById('p2').value, p3: document.getElementById('p3').value,
                btnText: document.getElementById('btnText').value, btnLink: document.getElementById('btnLink').value
            }).then(() => alert("저장 완료!"));
        }

        function addAd() {
            const n = document.getElementById('num').value;
            const d = document.getElementById('days').value;
            if(!n || !d) return alert("번호와 기간 필수!");
            db.ref('ads/' + n).set({
                url: document.getElementById('url').value,
                link: document.getElementById('link').value,
                expiry: Date.now() + (d * 24 * 3600000)
            }).then(() => alert(n + "번 등록 완료!"));
        }

        function removeAd() {
            const n = document.getElementById('num').value;
            if(n && confirm("해당 광고를 삭제하시겠습니까?")) db.ref('ads/' + n).remove().then(() => alert("삭제 완료"));
        }
    </script>
</body>
</html>
