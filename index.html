<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돗자리 (DOT-ZARI)</title>
    <style>
        /* 차분한 오프화이트와 베이지 톤으로 변경 */
        body { font-family: 'Apple SD Gothic Neo', sans-serif; text-align: center; background-color: #f8f7f2; margin: 0; padding: 20px; color: #4a4a4a; }
        
        .header-box { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px; border: 1px solid #e0ddd5; }
        h1 { font-size: 1.6rem; margin: 0; color: #5d5a52; letter-spacing: -1px; }
        .sub-title { font-size: 0.85rem; color: #a09d94; margin: 8px 0; }

        /* 버튼 컬러를 차분한 브라운으로 */
        #price-toggle-btn { background: #8c8679; color: #fff; border: none; padding: 10px 22px; border-radius: 50px; cursor: pointer; font-weight: bold; margin-bottom: 10px; font-size: 0.85rem; transition: 0.2s; }
        #price-toggle-btn:hover { background: #767065; }
        
        .price-container { display: none; justify-content: center; gap: 10px; margin: 15px 0; flex-wrap: wrap; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        
        .price-card { background: #fff; padding: 15px; border-radius: 18px; border: 1px solid #eee; flex: 1; min-width: 90px; }
        .price-card b { font-size: 1rem; color: #8c8679; }

        /* 격자판 색상을 연한 브라운 계열로 */
        #grid-container { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; background-color: #e0ddd5; border: 1px solid #d1cec4; border-radius: 12px; width: 95%; max-width: 500px; margin: 0 auto; overflow: hidden; padding: 2px; }
        .cell { background-color: #fff; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; aspect-ratio: 1 / 1; }
        
        /* 선택 시 부드러운 강조 */
        .cell.selected { background-color: #f0ede5 !important; border: 2px solid #8c8679; z-index: 5; transform: scale(1.05); border-radius: 4px; }
        
        .cell.occupied { background-size: cover; background-position: center; }
        .timer-label { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(140, 134, 121, 0.85); color: #fff; font-size: 0.5rem; padding: 1px 0; display: none; }
        .occupied .timer-label { display: block; }

        /* 모달 팝업 */
        #modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        #modal img { max-width: 90%; max-height: 80%; border-radius: 15px; border: 2px solid #fff; }

        /* 하단 안내창 */
        .info-panel { margin-top: 25px; padding: 25px; background: white; border-radius: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.02); width: 90%; max-width: 400px; display: inline-block; border: 1px solid #eee; }
        .dm-btn { display: block; width: 100%; padding: 18px; font-size: 1.1rem; font-weight: bold; background: #8c8679; color: white; border: none; border-radius: 18px; text-decoration: none; box-sizing: border-box; transition: 0.2s; }
        .dm-btn:hover { background: #767065; }

        /* 관리자용 */
        #admin-panel { display: none; margin-top: 20px; padding: 20px; background: white; border-radius: 20px; border: 1px dashed #ccc; }
        #secret-trigger { width: 40px; height: 40px; position: fixed; bottom: 0; right: 0; z-index: 999; }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>돗자리 ⛺️ <span style="font-size:1.1rem; color:#b5b0a5;">DOT-ZARI</span></h1>
        <div class="sub-title">차분하게 즐기는 인스타 광고 명당</div>
        <button id="price-toggle-btn" onclick="togglePrice()">💳 분양가 확인</button>
        <div id="price-list" class="price-container">
            <div class="price-card"><span style="font-size:0.75rem;">1일</span><br><b>1,000원</b></div>
            <div class="price-card"><span style="font-size:0.75rem;">1주일</span><br><b>5,000원</b></div>
            <div class="price-card" style="border:1.5px solid #8c8679;"><span style="font-size:0.75rem; color:#8c8679; font-weight:bold;">1개월(Best)</span><br><b>20,000원</b></div>
        </div>
    </div>

    <div id="grid-container"></div>

    <div class="info-panel">
        <div id="selected-info" style="font-weight:600; color:#8c8679; margin-bottom:15px;">편안한 자리를 선택해 보세요</div>
        <a href="https://www.instagram.com/my.dotzari/" target="_blank" class="dm-btn">여기에 돗자리 펴기</a>
    </div>

    <div id="modal" onclick="closeModal()">
        <img id="modal-img" src="" alt="확대보기">
    </div>

    <div id="secret-trigger" onclick="openAdmin()"></div>
    <div id="admin-panel">
        <input type="number" id="cell-num" placeholder="칸 번호">
        <input type="text" id="img-url" placeholder="이미지 URL">
        <input type="number" id="ad-hours" placeholder="시간(h)">
        <button onclick="addAd()">게시</button>
    </div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        let adData = {}; 

        function togglePrice() {
            const list = document.getElementById('price-list');
            const btn = document.getElementById('price-toggle-btn');
            const isOpen = list.style.display === 'flex';
            list.style.display = isOpen ? 'none' : 'flex';
            btn.innerText = isOpen ? '💳 분양가 확인' : '❌ 닫기';
        }

        function initGrid() {
            gridContainer.innerHTML = '';
            for (let i = 1; i <= 150; i++) {
                const cell = document.createElement('div');
                cell.id = `cell-${i}`;
                cell.className = 'cell';
                const label = document.createElement('div');
                label.className = 'timer-label';
                cell.appendChild(label);
                updateCell(i, cell);
                
                cell.addEventListener('click', () => {
                    document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
                    cell.classList.add('selected');
                    const data = adData[i];
                    if (data && data.expiry > Date.now()) {
                        openModal(data.url);
                    } else {
                        document.getElementById('selected-info').innerText = `${i}번 명당을 선택했어요`;
                    }
                });
                gridContainer.appendChild(cell);
            }
        }

        function openModal(url) {
            document.getElementById('modal-img').src = url;
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function updateCell(i, el) {
            const data = adData[i];
            if (data && data.expiry > Date.now()) {
                el.classList.add('occupied');
                el.style.backgroundImage = `url('${data.url}')`;
                const remain = data.expiry - Date.now();
                const h = Math.floor(remain / 3600000);
                el.querySelector('.timer-label').innerText = `${h}시간 남음`;
            } else {
                el.classList.remove('occupied');
                el.style.backgroundImage = '';
            }
        }

        setInterval(() => {
            for(let i=1; i<=150; i++) {
                const el = document.getElementById(`cell-${i}`);
                if(el) updateCell(i, el);
            }
        }, 60000);

        function openAdmin() { if(prompt("암호:") === "1234") document.getElementById('admin-panel').style.display='block'; }
        function addAd() {
            const n = document.getElementById('cell-num').value;
            const u = document.getElementById('img-url').value;
            const h = document.getElementById('ad-hours').value;
            adData[n] = { url: u, expiry: Date.now() + (h * 3600000) };
            initGrid();
            alert("돗자리 깔기 완료! ✨");
        }
        initGrid();
    </script>
</body>
</html>
