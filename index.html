<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Land 10,000</title>
    <style>
        /* 디자인 코드를 여기에 합쳤습니다 */
        body { font-family: 'Apple SD Gothic Neo', sans-serif; text-align: center; background-color: #f8f9fa; margin: 0; padding: 20px; }
        .status-bar { background: #333; color: #fff; padding: 10px 20px; border-radius: 50px; display: inline-block; margin-bottom: 10px; font-weight: bold; }
        #next-price-info { color: #ff4757; font-weight: bold; font-size: 0.9rem; margin-bottom: 20px; }
        #grid-container { 
            display: grid; 
            grid-template-columns: repeat(50, 12px); 
            gap: 1px; 
            background-color: #ddd; 
            border: 3px solid #333; 
            width: fit-content; 
            margin: 0 auto; 
            padding: 1px; 
        }
        .cell { width: 12px; height: 12px; background-color: white; cursor: pointer; }
        .cell:hover { background-color: #ffeb3b; }
        .cell.sold { background-color: #ff5252; }
        .cell.event { background-color: #70a1ff !important; }
        .info-panel { margin-top: 30px; padding: 20px; background: white; display: inline-block; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .buy-btn { padding: 15px 40px; font-size: 1.1rem; font-weight: bold; background: linear-gradient(45deg, #ff4757, #ff6b81); color: white; border: none; border-radius: 30px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>디지털 땅 10,000 프로젝트</h1>
        <div class="status-bar">
            <span id="price-tag">현재 시세: 1,000원</span> | 
            <span id="sold-count">분양 완료: 8 / 10,000</span>
        </div>
        <p id="next-price-info">다음 가격 인상까지 2칸 남았습니다!</p>
    </header>

    <main>
        <div id="grid-container"></div>
        <div class="info-panel">
            <h3 id="selected-info">칸을 선택해 주세요</h3>
            <button class="buy-btn" onclick="openEnroll()">지금 이 가격에 선점하기</button>
        </div>
    </main>

    <script>
        /* 기능 코드를 여기에 합쳤습니다 */
        const gridContainer = document.getElementById('grid-container');
        let soldCount = 8; 
        const eventCells = [15, 42, 88, 120]; 

        for (let i = 1; i <= 1000; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            if (i <= soldCount) cell.classList.add('sold');
            if (eventCells.includes(i)) cell.classList.add('event');

            cell.addEventListener('click', () => {
                if (eventCells.includes(i)) {
                    alert("🎊 보물 칸 발견! 사전 예약 시 1칸 무료 증정!");
                } else {
                    document.getElementById('selected-info').innerText = `${i}번 칸이 선택되었습니다.`;
                }
            });
            gridContainer.appendChild(cell);
        }

        function openEnroll() {
            const email = prompt("이 가격은 곧 마감됩니다! 알림을 받으실 이메일을 남겨주세요.");
            if(email) alert("감사합니다! 정식 오픈 시 연락드리겠습니다.");
        }
    </script>
</body>
</html>
