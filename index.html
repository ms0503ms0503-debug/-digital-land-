<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIGITAL LAND 10,000</title>
    <style>
        /* 힙한 다크 모드 & 네온 감성 디자인 */
        :root { --main-bg: #0a0a0a; --card-bg: #1a1a1a; --neon-pink: #ff007a; --neon-blue: #00d4ff; }
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: var(--main-bg); color: white; margin: 0; padding: 20px; overflow-x: hidden; }
        
        .header-box { margin-bottom: 30px; }
        h1 { font-size: 1.8rem; letter-spacing: -1px; margin-bottom: 5px; background: linear-gradient(to right, var(--neon-pink), var(--neon-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status-bar { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }

        /* 격자판 - 힙하게 수정 */
        #grid-container { 
            display: grid; 
            grid-template-columns: repeat(20, 1fr); 
            gap: 1px; 
            background-color: #333; 
            border: 2px solid #333; 
            width: 100%; 
            max-width: 500px; 
            margin: 20px auto; 
            aspect-ratio: 1 / 1;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .cell { background-color: var(--card-bg); transition: 0.2s; position: relative; }
        .cell:hover { transform: scale(1.1); z-index: 5; background-color: #444; }
        .cell.occupied { background-size: cover; background-position: center; border: none; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }

        /* 사장님 전용 관리 섹션 (비밀번호 입력 시 등장) */
        #admin-panel { display: none; background: #222; padding: 15px; border-radius: 15px; margin-top: 20px; border: 1px solid var(--neon-blue); }
        input[type="text"], input[type="file"] { background: #333; border: 1px solid #444; color: white; padding: 8px; border-radius: 8px; margin-bottom: 10px; width: 80%; }

        /* 하단 구매 유도 패널 */
        .info-panel { margin-top: 30px; width: 100%; max-width: 400px; display: inline-block; }
        .dm-btn { 
            display: block; padding: 20px; font-size: 1.1rem; font-weight: 800; 
            background: white; color: black; border-radius: 18px; text-decoration: none; 
            transition: 0.3s; box-shadow: 0 10px 20px rgba(255,255,255,0.1);
        }
        .dm-btn:hover { background: var(--neon-pink); color: white; transform: translateY(-3px); }

        /* 사장님 모드 진입용 숨겨진 버튼 (하단 구석 클릭 시 작동) */
        #secret-trigger { width: 40px; height: 40px; position: fixed; bottom: 0; right: 0; cursor: default; }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>DIGITAL LAND 10,000</h1>
        <div class="status-bar">
            PRICE: 1,000 KRW | <span id="sold-count">0</span> / 10,000 SOLD
        </div>
    </div>

    <div id="grid-container"></div>

    <div class="info-panel">
        <a href="https://www.instagram.com/사장님_아이디/" target="_blank" class="dm-btn">
            CLAIM YOUR SPACE (DM)
        </a>
        <p style="color: #666; font-size: 0.8rem; margin-top: 15px;">이미지 주소와 칸 번호를 DM으로 보내주세요.</p>
    </div>

    <div id="admin-panel">
        <p style="color: var(--neon-blue); font-weight: bold; margin-top: 0;">MANAGER MODE</p>
        <input type="text" id="cell-number" placeholder="칸 번호 입력">
        <input type="text" id="img-url" placeholder="이미지 주소(URL) 입력">
        <button onclick="applyPhoto()" style="padding: 8px 20px; border-radius: 8px; background: var(--neon-blue); border: none; cursor: pointer;">적용하기</button>
    </div>

    <div id="secret-trigger" onclick="checkAdmin()"></div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        
        // 1. [여기에 수시로 추가] 정식으로 분양 완료된 데이터 보관
        const landOwners = {
            1: "https://via.placeholder.com/100", // 예시
        };

        const totalCells = 400;
        document.getElementById('sold-count').innerText = Object.keys(landOwners).length;

        // 격자 생성
        for (let i = 1; i <= totalCells; i++) {
            const cell = document.createElement('div');
            cell.id = `cell-${i}`;
            cell.classList.add('cell');
            if (landOwners[i]) {
                cell.classList.add('occupied');
                cell.style.backgroundImage = `url('${landOwners[i]}')`;
            }
            cell.addEventListener('click', () => alert(`${i}번 칸 선택됨`));
            gridContainer.appendChild(cell);
        }

        // 2. 사장님 인증 함수 (비밀번호: 1234 - 바꾸셔도 됩니다)
        function checkAdmin() {
            const pw = prompt("관리자 비밀번호를 입력하세요:");
            if (pw === "1234") {
                alert("관리자 모드 활성화");
                document.getElementById('admin-panel').style.display = 'block';
            }
        }

        // 3. 실시간 사진 적용 시뮬레이션
        function applyPhoto() {
            const num = document.getElementById('cell-number').value;
            const url = document.getElementById('img-url').value;
            const target = document.getElementById(`cell-${num}`);
            
            if (target && url) {
                target.classList.add('occupied');
                target.style.backgroundImage = `url('${url}')`;
                alert(`${num}번 칸에 적용되었습니다! (코드에도 반영해주셔야 저장됩니다)`);
            }
        }
    </script>
</body>
</html>
