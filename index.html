<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돗자리 (DOT-ZARI)</title>
    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; text-align: center; background-color: #fdfaf4; margin: 0; padding: 15px; }
        .header-box { background: #ffffff; padding: 30px 20px; border-radius: 30px; margin-bottom: 20px; border: 1.5px solid #f0ede5; box-shadow: 0 10px 25px rgba(212,163,115,0.08); position: relative; }
        .event-badge { display: inline-block; background: #dc2743; color: #fff; padding: 4px 12px; border-radius: 8px; font-weight: 800; font-size: 0.9rem; margin-bottom: 10px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.6; } }
        h1 { font-size: 2.2rem; margin: 0; color: #d4a373; font-weight: 900; }
        .sub-title { font-size: 1.1rem; color: #5a564e; margin: 10px 0; font-weight: 800; }

        .price-btn { background: #d4a373; color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #price-display { display: none; margin-top: 15px; padding: 15px; background: #fff9f0; border-radius: 15px; border: 1px dashed #d4a373; }

        #grid-container { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; background-color: #e9e5d9; border: 4px solid #fff; border-radius: 15px; width: 100%; max-width: 500px; margin: 0 auto; padding: 3px; }
        .cell { background-color: #fff; aspect-ratio: 1 / 1; border-radius: 2px; cursor: pointer; transition: 0.2s; position: relative; }
        
        .cell.selected { background-color: #FFEB3B !important; border: 1.5px solid #FBC02D; outline: none; }
        .cell.occupied { background-size: cover; background-position: center; }

        .selection-info { margin-top: 25px; font-size: 1.1rem; font-weight: 800; color: #d4a373; min-height: 1.5rem; }
        .dm-btn { display: block; width: 90%; max-width: 400px; margin: 10px auto 30px auto; padding: 20px; font-size: 1.3rem; font-weight: 900; background: linear-gradient(45deg, #f09433, #dc2743, #cc2366); color: white; border-radius: 30px; text-decoration: none; box-shadow: 0 10px 20px rgba(220,39,67,0.2); }

        /* 확대(모달) 레이아웃[span_2](start_span)[span_2](end_span) */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; color: white; }
        #modal-img { max-width: 90%; max-height: 70%; border-radius: 15px; box-shadow: 0 0 30px rgba(255,255,255,0.2); margin-bottom: 20px; }
        .timer-box { font-size: 1.5rem; font-weight: 900; color: #FFEB3B; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 10px; border: 1px solid #FFEB3B; }
        .close-modal { position: absolute; top: 20px; right: 20px; font-size: 2rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header-box">
        <div id="view-badge" class="event-badge">OPEN EVENT 🎁</div>
        <h1 id="view-title">돗자리</h1>
        <div id="view-sub" class="sub-title">불러오는 중...</div>
        <button class="price-btn" onclick="togglePrice()">💰 분양 가격표 보기</button>
        <div id="price-display">
            <p>📍 24시간: <span id="p1">5,000원</span></p>
            <p>📍 1주일: <span id="p2">30,000원</span></p>
            <p>📍 1개월: <span id="p3">100,000원</span></p>
        </div>
    </div>

    <div id="grid-container"></div>
    <div id="selection-text" class="selection-info">원하는 자리를 클릭해보세요!</div>
    <a href="https://www.instagram.com/my.dotzari/" target="_blank" class="dm-btn">이벤트 참여하기 (DM)</a>

    <!-- 확대창(모달) 구조[span_3](start_span)[span_3](end_span) -->
    <div id="modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img id="modal-img" src="" alt="확대 광고">
        <div id="timer" class="timer-box">남은 시간: 계산 중...</div>
    </div>

    <script>
        const STORAGE_KEY = 'dotzari_data_v1';
        const TEXT_KEY = 'dotzari_text_v1';
        let timerInterval;

        function togglePrice() {
            const disp = document.getElementById('price-display');
            disp.style.display = disp.style.display === 'block' ? 'none' : 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            clearInterval(timerInterval);
        }

        function formatTime(ms) {
            if (ms <= 0) return "광고 종료";
            const h = Math.floor(ms / 3600000);
            const m = Math.floor((ms % 3600000) / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            return h + "시간 " + m + "분 " + s + "초";
        }

        function loadContent() {
            const textData = JSON.parse(localStorage.getItem(TEXT_KEY)) || {};
            document.getElementById('view-badge').innerText = textData.badge || "OPEN EVENT 🎁";
            document.getElementById('view-title').innerText = textData.title || "돗자리";
            document.getElementById('view-sub').innerText = textData.sub || "지금 입점하면 광고 시간 2배!";
            document.getElementById('p1').innerText = textData.p1 || "5,000원";
            document.getElementById('p2').innerText = textData.p2 || "30,000원";
            document.getElementById('p3').innerText = textData.p3 || "100,000원";

            const adData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
            const grid = document.getElementById('grid-container');
            const selectionText = document.getElementById('selection-text');
            grid.innerHTML = '';

            for (let i = 1; i <= 150; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                const ad = adData[i];
                const isOccupied = ad && ad.expiry > Date.now();

                if (isOccupied) {
                    cell.style.backgroundImage = `url('${ad.url}')`;
                    cell.classList.add('occupied');
                }
                
                cell.onclick = function(e) {
                    // 이미 광고가 있는 칸을 누르면 확대 및 타이머 작동[span_4](start_span)[span_4](end_span)
                    if (isOccupied) {
                        e.stopPropagation();
                        const modal = document.getElementById('modal');
                        const modalImg = document.getElementById('modal-img');
                        const timerDisp = document.getElementById('timer');
                        
                        modalImg.src = ad.url;
                        modal.style.display = 'flex';

                        clearInterval(timerInterval);
                        const updateTimer = () => {
                            const remain = ad.expiry - Date.now();
                            timerDisp.innerText = "남은 분양 시간: " + formatTime(remain);
                            if (remain <= 0) closeModal();
                        };
                        updateTimer();
                        timerInterval = setInterval(updateTimer, 1000);
                    } else {
                        // 빈 자리면 노란색 선택 기능[span_5](start_span)[span_5](end_span)
                        const prevSelected = document.querySelectorAll('.cell.selected');
                        prevSelected.forEach(c => c.classList.remove('selected'));
                        this.classList.add('selected');
                        selectionText.innerText = "선택하신 자리는 " + i + "번입니다!";
                        selectionText.style.color = "#dc2743";
                    }
                };
                grid.appendChild(cell);
            }
        }
        loadContent();
    </script>
</body>
</html>
