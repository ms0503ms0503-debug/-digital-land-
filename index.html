<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돗자리 (DOT-ZARI)</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; text-align: center; background-color: #fdfaf4; margin: 0; padding: 15px; }
        .header-box { background: #ffffff; padding: 30px 20px; border-radius: 30px; margin-bottom: 20px; border: 1.5px solid #f0ede5; box-shadow: 0 10px 25px rgba(212,163,115,0.08); position: relative; }
        .visitor-count { position: absolute; top: 15px; right: 20px; font-size: 0.75rem; color: #a19d94; font-weight: bold; background: #f8f5f0; padding: 4px 10px; border-radius: 12px; }
        .event-badge { display: inline-block; background: #dc2743; color: #fff; padding: 4px 12px; border-radius: 8px; font-weight: 800; font-size: 0.9rem; margin-bottom: 10px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.6; } }
        h1 { font-size: 2.2rem; margin: 0; color: #d4a373; font-weight: 900; }
        .sub-title { font-size: 1.1rem; color: #5a564e; margin: 10px 0; font-weight: 800; }

        /* 가격표 확인 버튼 */
        .price-open-btn { display: inline-block; background: #5a564e; color: white; padding: 6px 15px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; cursor: pointer; margin-top: 5px; border: none; }
        
        #grid-container { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; background-color: #e9e5d9; border: 4px solid #fff; border-radius: 15px; width: 100%; max-width: 500px; margin: 0 auto; padding: 3px; }
        .cell { background-color: #fff; aspect-ratio: 1 / 1; border-radius: 2px; cursor: pointer; transition: 0.2s; position: relative; }
        .cell.occupied { background-size: cover; background-position: center; }
        
        .dm-btn { display: block; width: 90%; max-width: 400px; margin: 20px auto; padding: 20px; font-size: 1.3rem; font-weight: 900; background: linear-gradient(45deg, #f09433, #dc2743, #cc2366); color: white; border-radius: 30px; text-decoration: none; box-shadow: 0 10px 20px rgba(220,39,67,0.2); }
        
        /* 공통 모달 스타일 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { width: 85%; max-width: 400px; text-align: center; }
        .modal-tag-bar { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .modal-tag { background: rgba(255,255,255,0.15); color: #fff; padding: 6px 12px; border-radius: 10px; font-size: 0.75rem; font-weight: bold; }
        #modal-img { width: 100%; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        
        /* 가격 전용 팝업 스타일 */
        .price-card { background: #fff; border-radius: 25px; padding: 30px 20px; text-align: center; }
        .price-card h3 { color: #d4a373; margin-top: 0; font-weight: 900; }
        .price-row { display: flex; justify-content: space-between; padding: 15px 10px; border-bottom: 1px solid #f0ede5; font-size: 1rem; color: #5a564e; }
        .price-row:last-child { border-bottom: none; }
        .price-val { font-weight: 800; color: #dc2743; }
        .close-btn { margin-top: 20px; background: #f0ede5; color: #5a564e; border: none; padding: 10px 25px; border-radius: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header-box">
        <div class="visitor-count">TODAY <span id="total-visits">0</span></div>
        <div id="view-badge" class="event-badge">OPEN</div>
        <h1 id="view-title">돗자리</h1>
        <div id="view-sub" class="sub-title">불러오는 중...</div>
        <!-- 가격표 버튼 추가 -->
        <button class="price-open-btn" onclick="openPriceModal()">💰 분양 가격표 확인</button>
    </div>

    <div id="grid-container"></div>
    <a href="#" id="event-link" target="_blank" class="dm-btn">광고 문의하기</a>

    <!-- 1. 광고 상세 모달 -->
    <div id="ad-modal" class="modal-overlay" onclick="closeAdModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-tag-bar">
                <div id="click-count" class="modal-tag">👀 조회 0</div>
                <div id="spot-num" class="modal-tag" style="background:#d4a373;">📍 0번 자리</div>
            </div>
            <img id="modal-img" src="">
            <div id="timer" class="modal-tag" style="margin-top:15px; display:inline-block; color:#FFEB3B; border:1px solid rgba(255,235,59,0.3);">⏳ 계산 중...</div>
        </div>
    </div>

    <!-- 2. 가격표 전용 모달 -->
    <div id="price-modal" class="modal-overlay" onclick="closePriceModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="price-card">
                <h3>돗자리 분양가</h3>
                <div class="price-row"><span>1일 권</span><span id="p1-display" class="price-val">0원</span></div>
                <div class="price-row"><span>7일 권</span><span id="p2-display" class="price-val">0원</span></div>
                <div class="price-row"><span>30일 권</span><span id="p3-display" class="price-val">0원</span></div>
                <button class="close-btn" onclick="closePriceModal()">닫기</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA8smXxxCJWa1OrrBxnJG2oN4R2T5NKStY",
            authDomain: "dotzari.firebaseapp.com",
            databaseURL: "https://dotzari-default-rtdb.firebaseio.com",
            projectId: "dotzari",
            storageBucket: "dotzari.firebasestorage.app",
            messagingSenderId: "999257002195",
            appId: "1:999257002195:web:184f3716dd05a862600426"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let timerInterval;
        const today = new Date().toISOString().slice(0, 10);

        function openPriceModal() { document.getElementById('price-modal').style.display = 'flex'; }
        function closePriceModal() { document.getElementById('price-modal').style.display = 'none'; }
        function closeAdModal() { document.getElementById('ad-modal').style.display = 'none'; clearInterval(timerInterval); }

        db.ref('/').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            const adData = data.ads || {};
            const textData = data.text || {};
            
            document.getElementById('view-badge').innerText = textData.badge || "OPEN";
            document.getElementById('view-title').innerText = textData.title || "돗자리";
            document.getElementById('view-sub').innerText = textData.sub || "빈자리를 선점하세요!";
            document.getElementById('event-link').innerText = textData.btnText || "광고 문의하기";
            document.getElementById('event-link').href = textData.btnLink || "#";

            // 가격표 데이터 세팅
            document.getElementById('p1-display').innerText = textData.p1 || "문의";
            document.getElementById('p2-display').innerText = textData.p2 || "문의";
            document.getElementById('p3-display').innerText = textData.p3 || "문의";

            const grid = document.getElementById('grid-container');
            grid.innerHTML = '';
            for (let i = 1; i <= 150; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                const ad = adData[i];
                if (ad && ad.expiry > Date.now()) {
                    cell.style.backgroundImage = `url('${ad.url}')`;
                    cell.classList.add('occupied');
                    cell.onclick = (e) => {
                        e.stopPropagation();
                        document.getElementById('modal-img').src = ad.url;
                        document.getElementById('spot-num').innerText = `📍 ${i}번 자리`;
                        document.getElementById('ad-modal').style.display = 'flex';
                        
                        db.ref('stats/ads/' + today + '/' + i).transaction(c => (c || 0) + 1);
                        db.ref('stats/ads/' + today + '/' + i).on('value', s => {
                            document.getElementById('click-count').innerText = `👀 조회 ${s.val() || 0}`;
                        });

                        clearInterval(timerInterval);
                        timerInterval = setInterval(() => {
                            const rem = ad.expiry - Date.now();
                            if (rem <= 0) { document.getElementById('timer').innerText = "분양 종료"; return; }
                            const d = Math.floor(rem / 86400000);
                            const h = String(Math.floor((rem % 86400000) / 3600000)).padStart(2, '0');
                            const m = String(Math.floor((rem % 3600000) / 60000)).padStart(2, '0');
                            document.getElementById('timer').innerText = `⏳ ${d}일 ${h}:${m} 남음`;
                        }, 1000);
                    };
                }
                grid.appendChild(cell);
            }
        });

        db.ref('stats/visits/' + today).transaction(c => (c || 0) + 1);
        db.ref('stats/visits/' + today).on('value', s => { document.getElementById('total-visits').innerText = s.val() || 0; });
    </script>
</body>
</html>
