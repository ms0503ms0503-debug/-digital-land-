<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Board 100</title>
    <style>
        /* [처음 UI 그대로] 깔끔한 화이트톤 스타일 */
        body { font-family: sans-serif; text-align: center; background-color: #ffffff; margin: 0; padding: 20px; }
        header { margin-bottom: 20px; }
        .status-bar { background: #333; color: #fff; padding: 10px 20px; border-radius: 50px; display: inline-block; margin-bottom: 10px; font-weight: bold; }

        /* [GRID] 100칸 (가로 10 x 세로 10) */
        #grid-container { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            gap: 1px; 
            background-color: #ccc; 
            border: 2px solid #333; 
            width: 100%; 
            max-width: 500px; 
            margin: 0 auto; 
            aspect-ratio: 1 / 1;
        }
        .cell { background-color: white; position: relative; cursor: pointer; }
        .cell:hover { background-color: #ffeb3b; }
        .cell.occupied { background-size: cover; background-position: center; border: none; }
        
        /* 타이머 라벨 (처음 UI를 해치지 않게 아주 얇게 표시) */
        .timer-label { 
            position: absolute; bottom: 0; left: 0; width: 100%; 
            background: rgba(0,0,0,0.6); color: #fff; 
            font-size: 0.5rem; padding: 1px 0;
            display: none; 
        }
        .occupied .timer-label { display: block; }

        /* [INFO] 첫 번째 버전의 깔끔한 안내창 */
        .info-panel { margin-top: 20px; padding: 20px; background: white; border: 1px solid #ddd; display: inline-block; border-radius: 10px; }
        .dm-btn { 
            display: inline-block; padding: 15px 30px; background-color: #ff4757; 
            color: white; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 10px;
        }

        /* 관리자 모드 */
        #admin-panel { display: none; margin-top: 20px; padding: 15px; border: 1px dashed #333; background: #f9f9f9; }
        #secret-trigger { width: 40px; height: 40px; position: fixed; bottom: 0; right: 0; }
    </style>
</head>
<body>

    <header>
        <h1>디지털 전광판 100</h1>
        <div class="status-bar">
            24시간 렌탈 | 오픈 이벤트: 시간 2배 적용!
        </div>
    </header>

    <div id="grid-container"></div>

    <div class="info-panel">
        <h3 id="selected-info">원하는 칸을 선택하세요</h3>
        <p>하루 1,000원 (이벤트로 48시간 노출)</p>
        <a href="https://www.instagram.com/사장님_아이디/" target="_blank" class="dm-btn">인스타 DM으로 신청하기</a>
    </div>

    <!-- 관리자 패널 (비밀번호: 1234) -->
    <div id="admin-panel">
        <h4>광고 등록 (관리자)</h4>
        <input type="number" id="cell-num" placeholder="칸 번호">
        <input type="text" id="img-url" placeholder="이미지 URL">
        <input type="number" id="ad-hours" placeholder="시간 (예: 24)">
        <button onclick="addAd()">즉시 게시</button>
    </div>

    <div id="secret-trigger" onclick="openAdmin()"></div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        let adData = {}; // 광고 데이터 저장

        function initGrid() {
            gridContainer.innerHTML = '';
            for (let i = 1; i <= 100; i++) {
                const cell = document.createElement('div');
                cell.id = `cell-${i}`;
                cell.className = 'cell';
                const label = document.createElement('div');
                label.className = 'timer-label';
                cell.appendChild(label);

                updateCell(i, cell);
                
                cell.addEventListener('click', () => {
                    document.getElementById('selected-info').innerText = `${i}번 칸 선택됨`;
                });
                gridContainer.appendChild(cell);
            }
        }

        function updateCell(i, el) {
            const data = adData[i];
            if (data && data.expiry > Date.now()) {
                el.classList.add('occupied');
                el.style.backgroundImage = `url('${data.url}')`;
                const remain = data.expiry - Date.now();
                const h = Math.floor(remain / 3600000);
                const m = Math.floor((remain % 3600000) / 60000);
                el.querySelector('.timer-label').innerText = `${h}h ${m}m`;
            } else {
                el.classList.remove('occupied');
                el.style.backgroundImage = '';
                if(adData[i]) delete adData[i];
            }
        }

        setInterval(() => {
            for(let i=1; i<=100; i++) {
                const el = document.getElementById(`cell-${i}`);
                if(el) updateCell(i, el);
            }
        }, 60000);

        function openAdmin() { if(prompt("암호:") === "1234") document.getElementById('admin-panel').style.display='block'; }
        
        function addAd() {
            const n = document.getElementById('cell-num').value;
            const u = document.getElementById('img-url').value;
            const h = document.getElementById('ad-hours').value;
            adData[n] = { url: u, expiry: Date.now() + (h * 2 * 3600000) };
            initGrid();
            alert("게시 완료!");
        }

        initGrid();
    </script>
</body>
</html>
