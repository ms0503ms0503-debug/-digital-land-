<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돗자리 (DOT-ZARI)</title>
    <style>
        /* [배경] 공원 느낌의 산뜻한 연그린 톤과 패턴 */
        body { 
            font-family: 'Apple SD Gothic Neo', sans-serif; 
            text-align: center; 
            background-color: #e8f5e9; 
            background-image: radial-gradient(#c8e6c9 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0; padding: 20px; color: #2e7d32; 
        }
        
        .header-box { 
            background: rgba(255, 255, 255, 0.9); 
            padding: 25px; border-radius: 30px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.05); 
            margin-bottom: 20px; border: 2px solid #a5d6a7; 
        }
        
        /* [이름] 빨간색 빼고 싱그러운 초록+오렌지 조합으로! */
        h1 { 
            font-size: 1.8rem; margin: 0; 
            background: linear-gradient(45deg, #2e7d32, #43a047, #fb8c00); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            font-weight: 900; letter-spacing: -1px; 
        }
        .sub-title { font-size: 0.85rem; color: #66bb6a; margin: 8px 0; font-weight: bold; }

        /* 버튼 컬러를 자연스럽게 */
        #price-toggle-btn { background: #43a047; color: #fff; border: none; padding: 10px 22px; border-radius: 50px; cursor: pointer; font-weight: bold; margin-bottom: 10px; font-size: 0.85rem; box-shadow: 0 4px 0 #2e7d32; }
        
        .price-container { display: none; justify-content: center; gap: 10px; margin: 15px 0; flex-wrap: wrap; animation: fadeIn 0.3s ease; }
        .price-card { background: #fff; padding: 15px; border-radius: 18px; border: 1px solid #c8e6c9; flex: 1; min-width: 90px; }
        .price-card b { font-size: 1rem; color: #2e7d32; }

        /* [격자판] 돗자리 느낌의 체크무늬 배경 */
        #grid-container { 
            display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; 
            background-color: #a5d6a7; border: 3px solid #2e7d32; 
            border-radius: 15px; width: 95%; max-width: 500px; 
            margin: 0 auto; overflow: hidden; padding: 3px; 
            box-shadow: 0 10px 30px rgba(46, 125, 50, 0.2);
        }
        .cell { background-color: #fff; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; aspect-ratio: 1 / 1; }
        
        /* [복구] 칸 선택 시 노란색으로 확실하게 색칠! */
        .cell.selected { 
            background-color: #fff176 !important; 
            border: 2px solid #fb8c00; 
            z-index: 5; transform: scale(1.1); 
            border-radius: 5px; box-shadow: 0 0 15px rgba(251, 140, 0, 0.4);
        }
        
        .cell.occupied { background-size: cover; background-position: center; }
        .timer-label { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(46, 125, 50, 0.8); color: #fff; font-size: 0.5rem; padding: 1px 0; display: none; }
        .occupied .timer-label { display: block; }

        /* 모달 팝업 */
        #modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        #modal img { max-width: 90%; max-height: 80%; border-radius: 20px; border: 4px solid #fff; }

        /* 하단 안내창 */
        .info-panel { 
            margin-top: 25px; padding: 25px; 
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 35px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); 
            width: 90%; max-width: 400px; display: inline-block; border: 2px solid #a5d6a7; 
        }
        
        .dm-btn { 
            display: block; width: 100%; padding: 20px; font-size: 1.2rem; font-weight: bold; 
            background: linear-gradient(45deg, #43a047, #fb8c00); 
            color: white; border: none; border-radius: 20px; text-decoration: none; box-sizing: border-box; 
            transition: 0.3s; box-shadow: 0 6px 0 #2e7d32;
        }
        .dm-btn:active { transform: translateY(4px); box-shadow: none; }

        /* 관리자용 */
        #admin-panel { display: none; margin-top: 20px; padding: 20px; background: white; border-radius: 20px; border: 1px dashed #2e7d32; }
        #secret-trigger { width: 50px; height: 50px; position: fixed; bottom: 0; right: 0; z-index: 999; }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>돗자리 ⛺️ <span style="font-size:1.1rem; color:#43a047;">DOT-ZARI</span></h1>
        <div class="sub-title">싱그러운 풀밭 위, 나만의 명당 찾기</div>
        <button id="price-toggle-btn" onclick="togglePrice()">💰 자리세 확인하기</button>
        <div id="price-list" class="price-container">
            <div class="price-card"><span>1일</span><br><b>1,000원</b></div>
            <div class="price-card"><span>1주일</span><br><b>5,000원</b></div>
            <div class="price-card" style="border:2px solid #43a047;"><b>1개월 2.0</b></div>
        </div>
    </div>

    <div id="grid-container"></div>

    <div class="info-panel">
        <div id="selected-info" style="font-weight:700; color:#2e7d32; margin-bottom:15px;">나무 그늘 아래 자리를 골라보세요!</div>
        <a href="https://www.instagram.com/my.dotzari/" target="_blank" class="dm-btn">여기 돗자리 깔기!</a>
    </div>

    <div id="modal" onclick="closeModal()">
        <img id="modal-img" src="" alt="확대보기">
    </div>

    <div id="secret-trigger" onclick="openAdmin()"></div>
    <div id="admin-panel">
        <input type="number" id="cell-num" placeholder="칸 번호">
        <input type="text" id="img-url" placeholder="이미지 URL">
        <input type="number" id="ad-hours" placeholder="시간(h)">
        <button onclick="addAd()">게시하기</button>
    </div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        let adData = {}; 

        function togglePrice() {
            const list = document.getElementById('price-list');
            const btn = document.getElementById('price-toggle-btn');
            const isOpen = list.style.display === 'flex';
            list.style.display = isOpen ? 'none' : 'flex';
            btn.innerText = isOpen ? '💰 자리세 확인하기' : '❌ 닫기';
        }

        function initGrid() {
            gridContainer.innerHTML = '';
            for (let i = 1; i <= 150; i++) {
                const cell = document.createElement('div');
                cell.id = `cell-${i}`;
                cell.className = 'cell';
                const label = document.createElement('div');
                label.className = 'timer-label';
                cell.appendChild(label);
                updateCell(i, cell);
                
                cell.addEventListener('click', () => {
                    // [선택 기능] 모든 칸 선택 해제 후 클릭한 칸만 강조
                    document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
                    cell.classList.add('selected');
                    
                    const data = adData[i];
                    if (data && data.expiry > Date.now()) {
                        openModal(data.url);
                    } else {
                        document.getElementById('selected-info').innerText = `✨ ${i}번 자리에 돗자리 깔까요?`;
                    }
                });
                gridContainer.appendChild(cell);
            }
        }

        function openModal(url) {
            document.getElementById('modal-img').src = url;
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function updateCell(i, el) {
            const data = adData[i];
            if (data && data.expiry > Date.now()) {
                el.classList.add('occupied');
                el.style.backgroundImage = `url('${data.url}')`;
                const remain = data.expiry - Date.now();
                const h = Math.floor(remain / 3600000);
                el.querySelector('.timer-label').innerText = `${h}h`;
            } else {
                el.classList.remove('occupied');
                el.style.backgroundImage = '';
            }
        }

        setInterval(() => {
            for(let i=1; i<=150; i++) {
                const el = document.getElementById(`cell-${i}`);
                if(el) updateCell(i, el);
            }
        }, 60000);

        function openAdmin() { if(prompt("사장님 암호:") === "1234") document.getElementById('admin-panel').style.display='block'; }
        function addAd() {
            const n = document.getElementById('cell-num').value;
            const u = document.getElementById('img-url').value;
            const h = document.getElementById('ad-hours').value;
            adData[n] = { url: u, expiry: Date.now() + (h * 3600000) };
            initGrid();
            alert(n + "번 명당 분양 완료! ⛺️");
        }
        initGrid();
    </script>
</body>
</html>
