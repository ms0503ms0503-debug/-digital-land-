<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Land - 시세 급상승 중!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>디지털 땅 10,000 프로젝트</h1>
        <div class="status-bar">
            <span id="price-tag">현재 시세: 1,000원</span> | 
            <span id="sold-count">분양 완료: 0 / 10,000</span>
        </div>
        <p id="next-price-info">다음 가격 인상까지 10칸 남았습니다!</p>
    </header>

    <main>
        <div id="grid-container"></div>
        
        <div class="info-panel">
            <h3 id="selected-info">칸을 선택해 주세요</h3>
            <button class="buy-btn" onclick="openEnroll()">지금 이 가격에 선점하기</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
