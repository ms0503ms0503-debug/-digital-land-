<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돗자리 (DOT-ZARI)</title>
    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; text-align: center; background-color: #fdfaf4; margin: 0; padding: 15px; }
        .header-box { background: #ffffff; padding: 30px 20px; border-radius: 30px; margin-bottom: 20px; border: 1.5px solid #f0ede5; box-shadow: 0 10px 25px rgba(212,163,115,0.08); }
        .event-badge { display: inline-block; background: #dc2743; color: #fff; padding: 4px 12px; border-radius: 8px; font-weight: 800; font-size: 0.9rem; margin-bottom: 10px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.6; } }
        h1 { font-size: 2.2rem; margin: 0; color: #d4a373; font-weight: 900; }
        .sub-title { font-size: 1.1rem; color: #5a564e; margin: 10px 0; font-weight: 800; }
        
        /* 가격표 스타일 */
        .price-tag { margin-top: 15px; padding: 12px; background: #fff9f0; border-radius: 15px; border: 1px dashed #d4a373; display: inline-block; min-width: 200px; }
        .price-label { font-size: 0.85rem; color: #888; font-weight: bold; display: block; margin-bottom: 4px; }
        .price-value { font-size: 1.2rem; color: #dc2743; font-weight: 900; }

        #grid-container { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; background-color: #e9e5d9; border: 4px solid #fff; border-radius: 15px; width: 100%; max-width: 500px; margin: 0 auto; padding: 3px; }
        .cell { background-color: #fff; aspect-ratio: 1 / 1; border-radius: 2px; }
        .cell.occupied { background-size: cover; background-position: center; }
        .dm-btn { display: block; width: 90%; max-width: 400px; margin: 30px auto; padding: 20px; font-size: 1.3rem; font-weight: 900; background: linear-gradient(45deg, #f09433, #dc2743, #cc2366); color: white; border-radius: 30px; text-decoration: none; box-shadow: 0 10px 20px rgba(220,39,67,0.2); }
    </style>
</head>
<body>
    <div class="header-box">
        <div id="view-badge" class="event-badge">LOADING...</div>
        <h1 id="view-title">돗자리</h1>
        <div id="view-sub" class="sub-title">데이터를 불러오는 중입니다.</div>
        
        <!-- 가격표 표시 영역 -->
        <div class="price-tag">
            <span class="price-label">💰 현재 분양가</span>
            <span id="view-price" class="price-value">문의 바람</span>
        </div>
    </div>

    <div id="grid-container"></div>
    <a href="https://www.instagram.com/my.dotzari/" target="_blank" class="dm-btn">이벤트 참여하기 (DM)</a>

    <script>
        const STORAGE_KEY = 'dotzari_data_v1';
        const TEXT_KEY = 'dotzari_text_v1';

        function loadContent() {
            // 문구 및 가격 불러오기
            const textData = JSON.parse(localStorage.getItem(TEXT_KEY)) || {
                badge: "OPEN EVENT 🎁",
                title: "돗자리 ⛺️",
                sub: "지금 입점하면 광고 시간 2배!",
                price: "1시간 / 1,000원"
            };
            document.getElementById('view-badge').innerText = textData.badge;
            document.getElementById('view-title').innerText = textData.title;
            document.getElementById('view-sub').innerText = textData.sub;
            document.getElementById('view-price').innerText = textData.price;

            // 광고 격자 불러오기
            const adData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
            const grid = document.getElementById('grid-container');
            grid.innerHTML = '';
            for (let i = 1; i <= 150; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (adData[i] && adData[i].expiry > Date.now()) {
                    cell.style.backgroundImage = `url('${adData[i].url}')`;
                    cell.classList.add('occupied');
                }
                grid.appendChild(cell);
            }
        }
        loadContent();
        window.addEventListener('storage', loadContent);
    </script>
</body>
</html>
