<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Land 1,000 Project</title>
    <style>
        /* [UI] 사장님이 선호하시는 깔끔한 화이트톤 디자인 */
        body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; text-align: center; background-color: #f8f9fa; margin: 0; padding: 20px; }
        header { margin-bottom: 20px; }
        .status-bar { background: #333; color: #fff; padding: 12px 25px; border-radius: 50px; display: inline-block; margin-bottom: 15px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* [GRID] 1,000칸 최적화 배치 (가로 25칸) */
        #grid-container { 
            display: grid; 
            grid-template-columns: repeat(25, 1fr); 
            gap: 1px; 
            background-color: #ccc; 
            border: 2px solid #333; 
            width: 100%; 
            max-width: 600px; /* 1,000칸을 위해 너비를 조금 넓힘 */
            margin: 0 auto; 
            aspect-ratio: 25 / 40; /* 가로 25 : 세로 40 비율 */
            overflow: hidden;
            background-color: #eee;
        }
        .cell { background-color: white; cursor: pointer; transition: 0.1s; }
        .cell:hover { background-color: #ffeb3b; z-index: 10; transform: scale(1.05); }
        .cell.occupied { background-size: cover; background-position: center; border: none; }

        /* [INFO] 안내 및 DM 버튼 */
        .info-panel { margin-top: 30px; padding: 25px; background: white; display: inline-block; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 450px; }
        .price-tag { color: #ff4757; font-weight: 800; font-size: 1.3rem; margin-bottom: 15px; display: block; }
        .dm-btn { 
            display: block; padding: 18px; font-size: 1.1rem; font-weight: bold; 
            background: linear-gradient(45deg, #ff4757, #ff6b81); 
            color: white; border: none; border-radius: 15px; text-decoration: none; cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3);
        }
        .dm-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4); }

        /* [ADMIN] 관리자 패널 (숨김 상태) */
        #admin-panel { display: none; margin-top: 20px; padding: 15px; border: 2px dashed #ff4757; border-radius: 15px; background: #fff1f2; }
        #admin-panel input { padding: 10px; margin: 5px; border-radius: 8px; border: 1px solid #ddd; width: 80%; }
        .admin-apply-btn { padding: 10px 20px; background: #333; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* 비밀 진입점 */
        #secret-trigger { width: 40px; height: 40px; position: fixed; bottom: 0; right: 0; z-index: 999; cursor: default; }
    </style>
</head>
<body>

    <header>
        <h1>디지털 부동산 1,000 프로젝트</h1>
        <div class="status-bar">
            현재가: 1,000원 | 분양 완료: <span id="sold-count">0</span> / 1,000
        </div>
    </header>

    <main>
        <div id="grid-container"></div>
        
        <div class="info-panel">
            <span class="price-tag" id="selected-info">원하는 칸을 선택하세요</span>
            <a href="https://www.instagram.com/사장님_아이디/" target="_blank" class="dm-btn">
                인스타 DM으로 분양 받기
            </a>
            <p style="font-size: 0.85rem; color: #777; margin-top: 15px; line-height: 1.6;">
                <strong>[얼리버드 혜택]</strong><br>
                지금 1,000원에 입주하고 정식 오픈 할인권을 받으세요!<br>
                이미지 URL과 번호를 DM으로 보내주시면 즉시 반영됩니다.
            </p>
        </div>

        <!-- 관리자 패널 -->
        <div id="admin-panel">
            <h3 style="margin-top:0; color:#ff4757;">Manager Mode</h3>
            <input type="number" id="cell-num" placeholder="칸 번호 (1-1000)">
            <input type="text" id="img-url" placeholder="이미지 주소 (URL)">
            <button class="admin-apply-btn" onclick="applyPhoto()">실시간 적용하기</button>
            <p style="font-size:0.7rem; color:#666;">* 적용 후 실제 반영을 위해선 깃허브 코드를 수정해야 합니다.</p>
        </div>
    </main>

    <!-- 비밀 버튼 -->
    <div id="secret-trigger" onclick="openAdmin()"></div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        
        // [확정 데이터] 판매된 칸 정보를 여기에 기록하세요 (번호: "이미지주소")
        const landOwners = {
            1: "https://via.placeholder.com/100", 
            25: "https://via.placeholder.com/100"
        };

        const totalCells = 1000;
        document.getElementById('sold-count').innerText = Object.keys(landOwners).length;

        // 1,000개 격자 생성
        for (let i = 1; i <= totalCells; i++) {
            const cell = document.createElement('div');
            cell.id = `cell-${i}`;
            cell.classList.add('cell');
            
            if (landOwners[i]) {
                cell.classList.add('occupied');
                cell.style.backgroundImage = `url('${landOwners[i]}')`;
            }

            cell.addEventListener('click', () => {
                document.getElementById('selected-info').innerText = `${i}번 칸 선택됨`;
            });
            gridContainer.appendChild(cell);
        }

        // 관리자 모드 실행 (비밀번호: 1234)
        function openAdmin() {
            const pw = prompt("관리자 암호를 입력하세요:");
            if(pw === "1234") {
                document.getElementById('admin-panel').style.display = 'block';
                window.scrollTo(0, document.body.scrollHeight);
            }
        }

        // 화면에 임시 적용
        function applyPhoto() {
            const num = document.getElementById('cell-num').value;
            const url = document.getElementById('img-url').value;
            const target = document.getElementById(`cell-${num}`);
            if(target && url) {
                target.classList.add('occupied');
                target.style.backgroundImage = `url('${url}')`;
                alert(num + "번 칸에 테스트 적용되었습니다!");
            } else {
                alert("번호와 URL을 정확히 입력해주세요.");
            }
        }
    </script>
</body>
</html>
