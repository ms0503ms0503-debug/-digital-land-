<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돗자리 (DOT-ZARI)</title>
    <style>
        /* [배경] 따뜻한 베이지와 차분한 샌드 톤 */
        body { 
            font-family: 'Apple SD Gothic Neo', sans-serif; 
            text-align: center; 
            background-color: #f4f1ea; /* 따뜻한 베이지 */
            background-image: radial-gradient(#e0ddd5 1px, transparent 1px);
            background-size: 25px 25px;
            margin: 0; padding: 20px; color: #5a564e; 
        }
        
        .header-box { 
            background: #ffffff; 
            padding: 30px 20px; border-radius: 25px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
            margin-bottom: 25px; border: 1px solid #e5e2d9; 
        }
        
        /* [타이틀] 세련된 다크 브라운 */
        h1 { 
            font-size: 1.7rem; margin: 0; 
            color: #4a4741;
            font-weight: 800; letter-spacing: -1px; 
        }
        .sub-title { font-size: 0.85rem; color: #9a958a; margin: 10px 0; font-weight: 500; }

        /* [버튼] 차분한 올리브 브라운 */
        #price-toggle-btn { 
            background: #8c8679; color: #fff; border: none; 
            padding: 10px 22px; border-radius: 50px; 
            cursor: pointer; font-weight: bold; margin-bottom: 10px; 
            font-size: 0.85rem; transition: 0.2s;
        }
        #price-toggle-btn:hover { background: #767065; }
        
        .price-container { display: none; justify-content: center; gap: 10px; margin: 15px 0; flex-wrap: wrap; animation: fadeIn 0.3s ease; }
        .price-card { background: #fff; padding: 15px; border-radius: 15px; border: 1px solid #eee; flex: 1; min-width: 90px; }
        .price-card b { font-size: 1rem; color: #8c8679; }

        /* [격자판] 정갈하고 깨끗한 느낌 */
        #grid-container { 
            display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; 
            background-color: #e5e2d9; border: 1px solid #dcd9d0; 
            border-radius: 12px; width: 95%; max-width: 500px; 
            margin: 0 auto; overflow: hidden; padding: 3px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.02);
        }
        .cell { background-color: #fff; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; aspect-ratio: 1 / 1; }
        
        /* [핵심] 칸 선택 시 따뜻한 옐로우 색칠 */
        .cell.selected { 
            background-color: #fdf2d0 !important; /* 부드러운 옐로우 */
            border: 2.5px solid #d4a373; /* 은은한 오렌지 브라운 */
            z-index: 5; transform: scale(1.08); 
            border-radius: 4px; box-shadow: 0 5px 15px rgba(212, 163, 115, 0.2);
        }
        
        .cell.occupied { background-size: cover; background-position: center; }
        .timer-label { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(140, 134, 121, 0.85); color: #fff; font-size: 0.5rem; padding: 2px 0; display: none; }
        .occupied .timer-label { display: block; }

        /* 하단 안내창 */
        .info-panel { 
            margin-top: 30px; padding: 25px; 
            background: #ffffff; border-radius: 30px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.02); 
            width: 90%; max-width: 400px; display: inline-block; border: 1px solid #f0ede5; 
        }
        
        /* [DM 버튼] 고급스러운 샌드 브라운 그라데이션 */
        .dm-btn { 
            display: block; width: 100%; padding: 20px; font-size: 1.1rem; font-weight: bold; 
            background: linear-gradient(135deg, #a9a394, #8c8679); 
            color: white; border: none; border-radius: 18px; text-decoration: none; box-sizing: border-box; 
            transition: 0.3s; 
        }
        .dm-btn:active { transform: scale(0.98); opacity: 0.9; }

        #admin-panel { display: none; margin-top: 20px; padding: 20px; background: white; border-radius: 20px; border: 1px dashed #ccc; }
        #admin-panel input { width: 80%; padding: 10px; margin: 5px; border-radius: 10px; border: 1px solid #ddd; }
        #secret-trigger { width: 50px; height: 50px; position: fixed; bottom: 0; right: 0; z-index: 999; }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>돗자리 ⛺️</h1>
        <div class="sub-title">포근한 오후, 당신의 자리를 마련해두었어요.</div>
        <button id="price-toggle-btn" onclick="togglePrice()">💳 이용 안내</button>
        <div id="price-list" class="price-container">
            <div class="price-card"><span>1일</span><br><b>1,000원</b></div>
            <div class="price-card"><span>1주일</span><br><b>5,000원</b></div>
            <div class="price-card" style="border:1.5px solid #8c8679;"><b>1개월 2.0</b></div>
        </div>
    </div>

    <div id="grid-container"></div>

    <div class="info-panel">
        <div id="selected-info" style="font-weight:600; color:#8c8679; margin-bottom:15px;">비어있는 명당을 선택해 보세요.</div>
        <a href="https://www.instagram.com/my.dotzari/" target="_blank" class="dm-btn">여기에 돗자리 펴기</a>
    </div>

    <div id="modal" onclick="closeModal()" style="display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center;">
        <img id="modal-img" src="" style="max-width:90%; max-height:80%; border-radius:15px; border:2px solid #fff;">
    </div>

    <div id="secret-trigger" onclick="openAdmin()"></div>
    <div id="admin-panel">
        <input type="number" id="cell-num" placeholder="칸 번호 (1-150)">
        <input type="text" id="img-url" placeholder="이미지 URL">
        <input type="number" id="ad-hours" placeholder="시간(h)">
        <button onclick="addAd()" style="background:#8c8679; color:white; border:none; padding:10px 20px; border-radius:10px;">등록</button>
    </div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        let adData = JSON.parse(localStorage.getItem('dotzari_data')) || {}; 

        function togglePrice() {
            const list = document.getElementById('price-list');
            const btn = document.getElementById('price-toggle-btn');
            const isOpen = list.style.display === 'flex';
            list.style.display = isOpen ? 'none' : 'flex';
            btn.innerText = isOpen ? '💳 이용 안내' : '❌ 닫기';
        }

        function initGrid() {
            gridContainer.innerHTML = '';
            for (let i = 1; i <= 150; i++) {
                const cell = document.createElement('div');
                cell.id = `cell-${i}`;
                cell.className = 'cell';
                const label = document.createElement('div');
                label.className = 'timer-label';
                cell.appendChild(label);
                updateCell(i, cell);
                
                cell.addEventListener('click', () => {
                    document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
                    cell.classList.add('selected');
                    
                    const data = adData[i];
                    if (data && data.expiry > Date.now()) {
                        openModal(data.url);
                    } else {
                        document.getElementById('selected-info').innerText = `✨ ${i}번 자리를 선택했어요.`;
                    }
                });
                gridContainer.appendChild(cell);
            }
        }

        function openModal(url) {
            document.getElementById('modal-img').src = url;
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function updateCell(i, el) {
            const data = adData[i];
            if (data && data.expiry > Date.now()) {
                el.classList.add('occupied');
                el.style.backgroundImage = `url('${data.url}')`;
                const remain = data.expiry - Date.now();
                const h = Math.floor(remain / 3600000);
                el.querySelector('.timer-label').innerText = `${h}h`;
            } else {
                el.classList.remove('occupied');
                el.style.backgroundImage = '';
            }
        }

        function openAdmin() { if(prompt("암호:") === "1234") document.getElementById('admin-panel').style.display='block'; }
        
        function addAd() {
            const n = document.getElementById('cell-num').value;
            const u = document.getElementById('img-url').value;
            const h = document.getElementById('ad-hours').value;
            if(!n || !u || !h) return;
            adData[n] = { url: u, expiry: Date.now() + (h * 3600000) };
            localStorage.setItem('dotzari_data', JSON.stringify(adData));
            initGrid();
            alert("돗자리 깔기 완료! ⛺️");
        }
        initGrid();
    </script>
</body>
</html>
