<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돗자리 (DOT-ZARI)</title>
    <style>
        /* 귀여운 느낌을 위해 전체적으로 둥글게 설정 */
        body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; text-align: center; background-color: #fff9e6; margin: 0; padding: 20px; color: #444; }
        
        .header-box { background: white; padding: 25px; border-radius: 35px; box-shadow: 0 8px 20px rgba(255, 212, 0, 0.2); margin-bottom: 20px; border: 3px solid #ffcc00; }
        h1 { font-size: 1.8rem; margin: 0; color: #ff9900; letter-spacing: -1px; }
        .sub-title { font-size: 0.9rem; color: #888; margin: 10px 0; }

        /* 귀여운 가격표 버튼 */
        #price-toggle-btn { background: #ffcc00; color: #fff; border: none; padding: 12px 25px; border-radius: 50px; cursor: pointer; font-weight: bold; margin-bottom: 10px; font-size: 0.9rem; box-shadow: 0 4px 0 #e6b800; transition: 0.1s; }
        #price-toggle-btn:active { transform: translateY(3px); box-shadow: none; }
        
        .price-container { display: none; justify-content: center; gap: 10px; margin: 15px 0; flex-wrap: wrap; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        
        .price-card { background: white; padding: 15px; border-radius: 20px; border: 2px solid #eee; flex: 1; min-width: 90px; }
        .price-card b { font-size: 1.1rem; color: #ff6600; }

        /* 150칸 격자판 */
        #grid-container { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; background-color: #ffedb3; border: 4px solid #ffcc00; border-radius: 15px; width: 95%; max-width: 500px; margin: 0 auto; overflow: hidden; padding: 3px; }
        .cell { background-color: white; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; aspect-ratio: 1 / 1; border-radius: 4px; }
        
        /* 선택 시 통통 튀는 효과 */
        @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        .cell.selected { border: 3px solid #ff3b30; z-index: 5; animation: bounce 0.6s infinite; box-shadow: 0 0 10px rgba(255, 59, 48, 0.5); }
        
        .cell.occupied { background-size: cover; background-position: center; }
        .timer-label { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(255, 153, 0, 0.8); color: #fff; font-size: 0.5rem; padding: 1px 0; display: none; font-weight: bold; }
        .occupied .timer-label { display: block; }

        /* 팝업 모달 */
        #modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; }
        #modal img { max-width: 85%; max-height: 75%; border-radius: 25px; border: 5px solid #ffcc00; }

        /* 안내 패널 */
        .info-panel { margin-top: 25px; padding: 30px; background: white; border-radius: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 90%; max-width: 400px; display: inline-block; border: 2px solid #eee; }
        .dm-btn { display: block; width: 100%; padding: 20px; font-size: 1.2rem; font-weight: bold; background: linear-gradient(45deg, #ffcc00, #ff9900); color: white; border: none; border-radius: 20px; text-decoration: none; box-sizing: border-box; box-shadow: 0 6px 0 #e68a00; }

        /* 관리자 모드 */
        #admin-panel { display: none; margin-top: 20px; padding: 20px; background: white; border-radius: 25px; border: 3px dashed #ffcc00; }
        #secret-trigger { width: 50px; height: 50px; position: fixed; bottom: 0; right: 0; z-index: 999; cursor: default; }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>돗자리 ⛺️ <span style="font-size:1.1rem; color:#ffcc00;">DOT-ZARI</span></h1>
        <div class="sub-title">포근한 인스타 명당, 나만의 자리를 찜해보세요!</div>
        <button id="price-toggle-btn" onclick="togglePrice()">💰 분양 가격표 보기</button>
        <div id="price-list" class="price-container">
            <div class="price-card"><span style="font-size:0.7rem;">1일권</span><br><b>1,000원</b></div>
            <div class="price-card"><span style="font-size:0.7rem;">1주권</span><br><b>5,000원</b></div>
            <div class="price-card" style="border-color:#ffcc00;"><span style="font-size:0.7rem; color:#ff9900;">1달권(인기)</span><br><b>20,000원</b></div>
        </div>
    </div>

    <div id="grid-container"></div>

    <div class="info-panel">
        <div id="selected-info" style="font-weight:bold; color:#ff9900; margin-bottom:15px; font-size:1.1rem;">✨ 어떤 자리가 마음에 드시나요?</div>
        <a href="https://www.instagram.com/my.dotzari/" target="_blank" class="dm-btn">여기 돗자리 깔기! (DM)</a>
    </div>

    <div id="modal" onclick="closeModal()">
        <img id="modal-img" src="" alt="확대보기">
    </div>

    <div id="admin-panel">
        <input type="number" id="cell-num" placeholder="칸 번호">
        <input type="text" id="img-url" placeholder="이미지 URL">
        <input type="number" id="ad-hours" placeholder="시간(h)">
        <button onclick="addAd()" style="background:#ff9900; color:white; border:none; padding:10px; border-radius:10px;">게시하기</button>
    </div>
    <div id="secret-trigger" onclick="openAdmin()"></div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        let adData = {}; 

        function togglePrice() {
            const list = document.getElementById('price-list');
            const btn = document.getElementById('price-toggle-btn');
            const isOpen = list.style.display === 'flex';
            list.style.display = isOpen ? 'none' : 'flex';
            btn.innerText = isOpen ? '💰 분양 가격표 보기' : '❌ 닫기';
        }

        function initGrid() {
            gridContainer.innerHTML = '';
            for (let i = 1; i <= 150; i++) {
                const cell = document.createElement('div');
                cell.id = `cell-${i}`;
                cell.className = 'cell';
                const label = document.createElement('div');
                label.className = 'timer-label';
                cell.appendChild(label);
                updateCell(i, cell);
                
                cell.addEventListener('click', () => {
                    document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
                    cell.classList.add('selected');

                    const data = adData[i];
                    if (data && data.expiry > Date.now()) {
                        openModal(data.url);
                    } else {
                        document.getElementById('selected-info').innerText = `✨ ${i}번 명당 찜콩!`;
                    }
                });
                gridContainer.appendChild(cell);
            }
        }

        function openModal(url) {
            document.getElementById('modal-img').src = url;
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function updateCell(i, el) {
            const data = adData[i];
            if (data && data.expiry > Date.now()) {
                el.classList.add('occupied');
                el.style.backgroundImage = `url('${data.url}')`;
                const remain = data.expiry - Date.now();
                const h = Math.floor(remain / 3600000);
                const m = Math.floor((remain % 3600000) / 60000);
                el.querySelector('.timer-label').innerText = `${h}시간 남음`;
            } else {
                el.classList.remove('occupied');
                el.style.backgroundImage = '';
            }
        }

        setInterval(() => {
            for(let i=1; i<=150; i++) {
                const el = document.getElementById(`cell-${i}`);
                if(el) updateCell(i, el);
            }
        }, 60000);

        function openAdmin() { if(prompt("꼬마사장님 암호:") === "1234") document.getElementById('admin-panel').style.display='block'; }
        function addAd() {
            const n = document.getElementById('cell-num').value;
            const u = document.getElementById('img-url').value;
            const h = document.getElementById('ad-hours').value;
            adData[n] = { url: u, expiry: Date.now() + (h * 3600000) };
            initGrid();
            alert(n + "번 자리에 돗자리 펴기 완료! ✨");
        }
        initGrid();
    </script>
</body>
</html>
