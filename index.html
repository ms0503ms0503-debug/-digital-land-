<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돗자리 (DOT-ZARI)</title>
    <style>
        /* [배경] 다시 돌아온 따뜻하고 포근한 베이지 */
        body { 
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; 
            text-align: center; 
            background-color: #fdfaf4; /* 훨씬 부드러운 밀크티 색상 */
            margin: 0; padding: 20px; color: #5a564e; 
        }
        
        /* [상단 배너] 귀여운 둥근 사각형 + 은은한 그림자 */
        .header-box { 
            background: #ffffff; 
            padding: 30px 20px; border-radius: 30px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.04); 
            margin-bottom: 25px; border: 1.5px solid #f0ede5; 
        }
        
        h1 { 
            font-size: 1.8rem; margin: 0; 
            color: #d4a373; /* 따뜻한 브라운 */
            font-weight: 800; letter-spacing: -1px; 
        }
        .sub-title { font-size: 0.9rem; color: #a5a093; margin: 10px 0; font-weight: 600; }

        /* [버튼] 귀여운 파스텔톤 안내 버튼 */
        #price-toggle-btn { 
            background: #faedcd; color: #8c8679; border: none; 
            padding: 8px 18px; border-radius: 50px; 
            cursor: pointer; font-weight: bold; margin-bottom: 10px; 
            font-size: 0.8rem; transition: 0.2s;
        }
        
        .price-container { display: none; justify-content: center; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
        .price-card { background: #fff; padding: 12px; border-radius: 15px; border: 1px solid #f0ede5; flex: 1; min-width: 80px; font-size: 0.8rem; }
        .price-card b { color: #d4a373; }

        /* [격자판] 정갈하고 깨끗한 돗자리판 */
        #grid-container { 
            display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; 
            background-color: #e9e5d9; 
            border: 2px solid #fff; 
            border-radius: 20px; width: 95%; max-width: 500px; 
            margin: 0 auto; overflow: hidden; padding: 5px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .cell { background-color: #fff; cursor: pointer; transition: 0.2s; position: relative; aspect-ratio: 1 / 1; border-radius: 4px; }
        
        /* [핵심 기능] 선택 시 부드럽게 노란색으로 색칠되는 효과 */
        .cell.selected { 
            background-color: #fef4a9 !important; /* 포근한 레몬옐로우 */
            border: 3.5px solid #d4a373; 
            z-index: 5; transform: scale(1.1); 
            box-shadow: 0 5px 15px rgba(212, 163, 115, 0.3);
        }
        
        .cell.occupied { background-size: cover; background-position: center; }

        /* [모달] 깔끔한 확대 창 */
        #modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); flex-direction: column; justify-content: center; align-items: center; }
        #modal img { max-width: 85%; max-height: 70%; border-radius: 20px; border: 3px solid #fff; }
        #modal-timer { margin-top: 15px; color: #fff; font-size: 1.1rem; font-weight: bold; background: #d4a373; padding: 8px 20px; border-radius: 50px; }

        /* [연락하기] 사장님이 강조하신 인스타 색감 버튼 */
        .info-panel { 
            margin-top: 30px; padding: 20px; 
            background: #ffffff; border-radius: 35px; 
            width: 90%; max-width: 400px; display: inline-block; border: 1px solid #f0ede5; 
        }
        
        .dm-btn { 
            display: block; width: 100%; padding: 20px; font-size: 1.2rem; font-weight: bold; 
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366); 
            color: white; border: none; border-radius: 25px; text-decoration: none; box-sizing: border-box; 
            transition: 0.3s; box-shadow: 0 8px 20px rgba(220, 39, 67, 0.2);
        }
        .dm-btn:active { transform: scale(0.97); }

        #admin-panel { display: none; margin-top: 20px; padding: 20px; background: white; border-radius: 20px; border: 1px dashed #d4a373; }
        #secret-trigger { width: 60px; height: 60px; position: fixed; bottom: 0; right: 0; z-index: 999; }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>돗자리 ⛺️</h1>
        <div class="sub-title">포근한 오후, 당신의 자리를 마련했어요.</div>
        <button id="price-toggle-btn" onclick="togglePrice()">💳 이용 안내</button>
        <div id="price-list" class="price-container">
            <div class="price-card">1일<br><b>1,000원</b></div>
            <div class="price-card">1주일<br><b>5,000원</b></div>
            <div class="price-card" style="border:1.5px solid #d4a373;">1개월<br><b>2.0</b></div>
        </div>
    </div>

    <div id="grid-container"></div>

    <div class="info-panel">
        <div id="selected-info" style="font-weight:700; color:#8c8679; margin-bottom:15px;">비어있는 자리를 선택해 보세요!</div>
        <a href="https://www.instagram.com/my.dotzari/" target="_blank" class="dm-btn">여기에 돗자리 펴기 (DM)</a>
    </div>

    <div id="modal" onclick="closeModal()">
        <img id="modal-img" src="">
        <div id="modal-timer"></div>
    </div>

    <div id="secret-trigger" onclick="openAdmin()"></div>
    <div id="admin-panel">
        <input type="number" id="cell-num" placeholder="번호">
        <input type="text" id="img-url" placeholder="이미지 주소">
        <input type="number" id="ad-hours" placeholder="시간">
        <button onclick="addAd()" style="background:#d4a373; color:white; border:none; padding:8px 15px; border-radius:10px;">등록</button>
    </div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        let adData = JSON.parse(localStorage.getItem('dotzari_data')) || {}; 

        function togglePrice() {
            const list = document.getElementById('price-list');
            list.style.display = list.style.display === 'flex' ? 'none' : 'flex';
        }

        function initGrid() {
            gridContainer.innerHTML = '';
            for (let i = 1; i <= 150; i++) {
                const cell = document.createElement('div');
                cell.id = `cell-${i}`;
                cell.className = 'cell';
                updateCell(i, cell);
                
                cell.addEventListener('click', () => {
                    // [색칠 기능] 선택한 칸만 부드러운 노란색으로 강조!
                    document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
                    cell.classList.add('selected');
                    
                    const data = adData[i];
                    if (data && data.expiry > Date.now()) {
                        openModal(i);
                    } else {
                        document.getElementById('selected-info').innerText = `✨ ${i}번 명당을 선택했어요!`;
                    }
                });
                gridContainer.appendChild(cell);
            }
        }

        function openModal(id) {
            const data = adData[id];
            const remain = data.expiry - Date.now();
            const h = Math.floor(remain / 3600000);
            const m = Math.floor((remain % 3600000) / 60000);
            document.getElementById('modal-img').src = data.url;
            document.getElementById('modal-timer').innerText = `⏰ 남은 시간: ${h}시간 ${m}분`;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function updateCell(i, el) {
            const data = adData[i];
            if (data && data.expiry > Date.now()) {
                el.classList.add('occupied');
                el.style.backgroundImage = `url('${data.url}')`;
            } else {
                el.classList.remove('occupied');
                el.style.backgroundImage = '';
            }
        }

        function openAdmin() { if(prompt("사장님 전용 암호:") === "1234") document.getElementById('admin-panel').style.display='block'; }
        
        function addAd() {
            const n = document.getElementById('cell-num').value;
            const u = document.getElementById('img-url').value;
            const h = document.getElementById('ad-hours').value;
            if(!n || !u || !h) return;
            adData[n] = { url: u, expiry: Date.now() + (h * 3600000) };
            localStorage.setItem('dotzari_data', JSON.stringify(adData));
            initGrid();
            alert("돗자리 등록 완료! ⛺️");
        }
        initGrid();
    </script>
</body>
</html>
