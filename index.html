<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돗자리 (DOT-ZARI)</title>
    <style>
        /* 인스타 바이럴 특유의 깨끗하지만 굵직한 느낌 */
        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            text-align: center; 
            background: #fdfdfd; /* 거의 화이트에 가까운 깨끗한 배경 */
            margin: 0; padding: 20px; color: #1a1a1a; 
        }
        
        /* 상단 배너: 심플하지만 굵은 테두리와 폰트로 임팩트 */
        .header-box { 
            background: #fff; 
            padding: 40px 20px; border-radius: 0 0 40px 40px; 
            margin: -20px -20px 30px -20px;
            border-bottom: 4px solid #1a1a1a; /* 굵은 하단 선으로 '조잡한 듯 힙한' 느낌 */
        }
        
        h1 { 
            font-size: 2.4rem; margin: 0; 
            font-weight: 900; letter-spacing: -2px;
            text-transform: uppercase;
        }
        
        .tag {
            display: inline-block; background: #1a1a1a; color: #fff;
            padding: 4px 12px; font-size: 0.8rem; border-radius: 5px;
            margin-top: 10px; font-weight: 700;
        }

        .sub-title { font-size: 1rem; color: #1a1a1a; margin: 15px 0; font-weight: 400; line-height: 1.4; }

        /* 이용 안내: 투박한 느낌의 버튼 */
        #price-toggle-btn { 
            background: #fff; color: #1a1a1a; border: 2px solid #1a1a1a; 
            padding: 10px 20px; border-radius: 0; /* 각진 버튼 */
            cursor: pointer; font-weight: 800; margin-bottom: 10px; 
            font-size: 0.85rem; box-shadow: 4px 4px 0 #1a1a1a; /* 그림자 효과 */
        }
        #price-toggle-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #1a1a1a; }
        
        .price-container { display: none; justify-content: center; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
        .price-card { background: #fff; padding: 15px; border: 2px solid #1a1a1a; flex: 1; min-width: 90px; font-weight: 700; }

        /* 격자판: 꽉 차는 느낌 */
        #grid-container { 
            display: grid; grid-template-columns: repeat(10, 1fr); gap: 1px; 
            background-color: #1a1a1a; 
            border: 3px solid #1a1a1a; 
            width: 100%; max-width: 500px; 
            margin: 0 auto; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .cell { background-color: #fff; cursor: pointer; transition: 0.1s; aspect-ratio: 1 / 1; }
        
        /* [사장님 요청] 선택 시 노란색으로 색칠되는 효과 - 강력하게! */
        .cell.selected { 
            background-color: #faff00 !important; /* 형광 노랑 */
            outline: 3px inset #1a1a1a;
            z-index: 10;
        }
        
        .cell.occupied { background-size: cover; background-position: center; }

        /* 모달: 인스타 느낌의 다크 배경 */
        #modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: #fff; flex-direction: column; justify-content: center; align-items: center; }
        #modal img { max-width: 90%; max-height: 70%; border: 4px solid #1a1a1a; }
        #modal-timer { margin-top: 20px; font-size: 1.5rem; font-weight: 900; color: #1a1a1a; text-decoration: underline; }
        .close-modal { position: absolute; top: 20px; right: 20px; font-size: 2rem; font-weight: 900; cursor: pointer; }

        /* 하단 버튼: 인스타 그라데이션 포인트 */
        .info-panel { margin-top: 40px; padding: 20px; width: 100%; box-sizing: border-box; }
        
        .dm-btn { 
            display: block; width: 100%; max-width: 400px; margin: 0 auto;
            padding: 22px; font-size: 1.3rem; font-weight: 900; 
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366); 
            color: white; border: none; border-radius: 50px; text-decoration: none; 
            box-sizing: border-box; transition: 0.3s;
        }

        #admin-panel { display: none; margin-top: 20px; padding: 20px; background: #eee; border: 2px solid #1a1a1a; }
        #secret-trigger { width: 50px; height: 50px; position: fixed; bottom: 0; right: 0; z-index: 999; }
    </style>
</head>
<body>

    <div class="header-box">
        <div class="tag">NOW OPEN</div>
        <h1>DOT ZARI</h1>
        <div class="sub-title"><b>가장 힙한 성수동 돗자리판.</b><br>지금 당신의 자리를 찜하세요.</div>
        <button id="price-toggle-btn" onclick="togglePrice()">HOW MUCH?</button>
        <div id="price-list" class="price-container">
            <div class="price-card">1 DAY<br>1,000</div>
            <div class="price-card">7 DAYS<br>5,000</div>
            <div class="price-card" style="background:#1a1a1a; color:#fff;">30 DAYS<br>20,000</div>
        </div>
    </div>

    <div id="grid-container"></div>

    <div class="info-panel">
        <div id="selected-info" style="font-weight:900; font-size:1.2rem; margin-bottom:20px; text-transform: uppercase;">SELECT YOUR SPOT</div>
        <a href="https://www.instagram.com/my.dotzari/" target="_blank" class="dm-btn">GET IT NOW (DM)</a>
    </div>

    <div id="modal">
        <div class="close-modal" onclick="closeModal()">✕</div>
        <img id="modal-img" src="">
        <div id="modal-timer"></div>
    </div>

    <div id="secret-trigger" onclick="openAdmin()"></div>
    <div id="admin-panel">
        <input type="number" id="cell-num" placeholder="No.">
        <input type="text" id="img-url" placeholder="URL">
        <input type="number" id="ad-hours" placeholder="HOUR">
        <button onclick="addAd()">OK</button>
    </div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        let adData = JSON.parse(localStorage.getItem('dotzari_data')) || {}; 

        function togglePrice() {
            const list = document.getElementById('price-list');
            list.style.display = list.style.display === 'flex' ? 'none' : 'flex';
        }

        function initGrid() {
            gridContainer.innerHTML = '';
            for (let i = 1; i <= 150; i++) {
                const cell = document.createElement('div');
                cell.id = `cell-${i}`;
                cell.className = 'cell';
                updateCell(i, cell);
                
                cell.addEventListener('click', () => {
                    // [색칠 기능] 모든 칸 초기화 후 선택한 칸만 노란색으로!
                    document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
                    cell.classList.add('selected');
                    
                    const data = adData[i];
                    if (data && data.expiry > Date.now()) {
                        openModal(i);
                    } else {
                        document.getElementById('selected-info').innerText = `SPOT NO.${i} SELECTED`;
                    }
                });
                gridContainer.appendChild(cell);
            }
        }

        function openModal(id) {
            const data = adData[id];
            const remain = data.expiry - Date.now();
            const h = Math.floor(remain / 3600000);
            const m = Math.floor((remain % 3600000) / 60000);
            document.getElementById('modal-img').src = data.url;
            document.getElementById('modal-timer').innerText = `LEFT: ${h}H ${m}M`;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function updateCell(i, el) {
            const data = adData[i];
            if (data && data.expiry > Date.now()) {
                el.classList.add('occupied');
                el.style.backgroundImage = `url('${data.url}')`;
            } else {
                el.classList.remove('occupied');
                el.style.backgroundImage = '';
            }
        }

        function openAdmin() { if(prompt("PW:") === "1234") document.getElementById('admin-panel').style.display='block'; }
        
        function addAd() {
            const n = document.getElementById('cell-num').value;
            const u = document.getElementById('img-url').value;
            const h = document.getElementById('ad-hours').value;
            if(!n || !u || !h) return;
            adData[n] = { url: u, expiry: Date.now() + (h * 3600000) };
            localStorage.setItem('dotzari_data', JSON.stringify(adData));
            initGrid();
        }
        initGrid();
    </script>
</body>
</html>
