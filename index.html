<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>돗자리 (DOT-ZARI)</title>
    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; text-align: center; background-color: #fdfaf4; margin: 0; padding: 15px; }
        .header-box { background: #ffffff; padding: 30px 20px; border-radius: 30px; margin-bottom: 20px; border: 1.5px solid #f0ede5; box-shadow: 0 10px 25px rgba(212,163,115,0.08); position: relative; }
        .event-badge { display: inline-block; background: #dc2743; color: #fff; padding: 4px 12px; border-radius: 8px; font-weight: 800; font-size: 0.9rem; margin-bottom: 10px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.6; } }
        h1 { font-size: 2.2rem; margin: 0; color: #d4a373; font-weight: 900; }
        .sub-title { font-size: 1.1rem; color: #5a564e; margin: 10px 0; font-weight: 800; }

        .price-btn { background: #d4a373; color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #price-display { display: none; margin-top: 15px; padding: 15px; background: #fff9f0; border-radius: 15px; border: 1px dashed #d4a373; }

        #grid-container { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; background-color: #e9e5d9; border: 4px solid #fff; border-radius: 15px; width: 100%; max-width: 500px; margin: 0 auto; padding: 3px; }
        .cell { background-color: #fff; aspect-ratio: 1 / 1; border-radius: 2px; cursor: pointer; transition: 0.2s; }
        
        /* 클릭 시 색상을 노랑색(#FFEB3B)으로 변경 */
        .cell.selected { background-color: #FFEB3B !important; border: 1.5px solid #FBC02D; }
        .cell.occupied { background-size: cover; background-position: center; }

        .dm-btn { display: block; width: 90%; max-width: 400px; margin: 30px auto; padding: 20px; font-size: 1.3rem; font-weight: 900; background: linear-gradient(45deg, #f09433, #dc2743, #cc2366); color: white; border-radius: 30px; text-decoration: none; box-shadow: 0 10px 20px rgba(220,39,67,0.2); }
    </style>
</head>
<body>
    <div class="header-box">
        <div id="view-badge" class="event-badge">OPEN EVENT 🎁</div>
        <h1 id="view-title">돗자리</h1>
        <div id="view-sub" class="sub-title">불러오는 중...</div>
        <button class="price-btn" onclick="togglePrice()">💰 분양 가격표 보기</button>
        <div id="price-display">
            <p>📍 24시간: <span id="p1">5,000원</span></p>
            <p>📍 1주일: <span id="p2">30,000원</span></p>
            <p>📍 1개월: <span id="p3">100,000원</span></p>
        </div>
    </div>

    <div id="grid-container"></div>
    <a href="https://www.instagram.com/my.dotzari/" target="_blank" class="dm-btn">이벤트 참여하기 (DM)</a>

    <script>
        const STORAGE_KEY = 'dotzari_data_v1';
        const TEXT_KEY = 'dotzari_text_v1';

        function togglePrice() {
            const disp = document.getElementById('price-display');
            disp.style.display = disp.style.display === 'block' ? 'none' : 'block';
        }

        function loadContent() {
            const textData = JSON.parse(localStorage.getItem(TEXT_KEY)) || {};
            document.getElementById('view-badge').innerText = textData.badge || "OPEN EVENT 🎁";
            document.getElementById('view-title').innerText = textData.title || "돗자리";
            document.getElementById('view-sub').innerText = textData.sub || "지금 입점하면 광고 시간 2배!";
            document.getElementById('p1').innerText = textData.p1 || "5,000원";
            document.getElementById('p2').innerText = textData.p2 || "30,000원";
            document.getElementById('p3').innerText = textData.p3 || "100,000원";

            const adData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
            const grid = document.getElementById('grid-container');
            grid.innerHTML = '';
            for (let i = 1; i <= 150; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (adData[i] && adData[i].expiry > Date.now()) {
                    cell.style.backgroundImage = `url('${adData[i].url}')`;
                    cell.classList.add('occupied');
                }
                
                // 클릭 이벤트: 알림창 띄우기 + 노랑색 토글
                cell.onclick = function() {
                    const isSelected = this.classList.contains('selected');
                    if (!isSelected) {
                        alert(i + "번 자리를 선택하셨습니다! DM으로 번호를 말씀해주세요.");
                    }
                    this.classList.toggle('selected');
                };
                grid.appendChild(cell);
            }
        }
        loadContent();
    </script>
</body>
</html>
